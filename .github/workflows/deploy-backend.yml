name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "backend/**, !backend/venv/**, !backend/.venv/**, !backend/__pycache__/**, !backend/.env"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: SSH and deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Create or activate virtual environment
            if [ ! -d "venv" ]; then
              echo "Virtual environment not found! Creating one..."
              python3 -m venv venv
            fi
            source venv/bin/activate

            # Install/update dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # Reload or start the PM2 application using ecosystem config
            pm2 restart ecosystem.config.js

            echo "Deployment completed successfully!"
